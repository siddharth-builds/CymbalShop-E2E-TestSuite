name: Playwright API Tests
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REQRES_BASE_URL: https://reqres.in
      API_TOKEN: sdet_portfolio_mock_token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/msplaywright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Create Kubernetes Cluster
        run: kind create cluster
      - name: Deploy Microservices
        run: |
          kubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/main/release/kubernetes-manifests.yaml
          kubectl wait --for=condition=available --timeout=500s deployment/frontend
      - name: Expose Application
        run: kubectl port-forward deployment/frontend 8080:8080 &
      - name: Wait for Microservices Mesh
        run: |
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080)" == "200" ]; do
            echo "Waiting for gRPC mesh to stabilize..."
            sleep 5
          done
      - name: Run Test Suite
        run: npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30 